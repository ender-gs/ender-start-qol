plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.29'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

group = project.mod_group_id
version = project.mod_version

// Load uncommitted local developer properties (local.properties)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def libsDir = "libs"
def modsFolder = project.findProperty('modsFolder') ?: localProperties.getProperty('modsFolder') ?: System.getenv('MODS_FOLDER') ?: "build/deploy"
def prismExe = project.findProperty('prismExe') ?: localProperties.getProperty('prismExe') ?: System.getenv('PRISM_EXE') ?: ""

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    flatDir {
        dirs libsDir
    }
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Local mod JAR files from local libs directory
    compileOnly files("${libsDir}/appliedenergistics2-forge-15.4.10.jar")
    compileOnly files("${libsDir}/buildinggadgets2-1.0.8.jar")
    compileOnly files("${libsDir}/ae2wtlib-15.3.3-forge.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : project.mod_name,
            "Specification-Vendor"    : project.mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.mod_name,
            "Implementation-Version"  : project.mod_version,
            "Implementation-Vendor"   : project.mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "enderqol.mixins.json"
        ])
    }
}

// Copy reobfuscated mod JAR to Star Technology Test mods folder
task deployMod(type: Copy) {
    dependsOn 'reobfJar'
    from jar
    into modsFolder
    rename { String fileName ->
        "enderqol-${project.mod_version}.jar"
    }
}


// Deploy and trigger Prism Launcher instance boot asynchronously without holding Gradle
task deployAndLaunch {
    dependsOn 'deployMod'
    doLast {
        Runtime.getRuntime().exec(["cmd", "/c", "start", "", prismExe, "--launch", "Star Technology Test"] as String[])
    }
}


